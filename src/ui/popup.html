<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Miru</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Miru</h1>
      <p class="subtitle">AI Browser Agent</p>
    </header>

    <main>
      <button id="getSummaryBtn" class="btn btn-primary">
        Get Page Summary
      </button>

      <div id="output" class="output hidden">
        <h2>Page Summary</h2>
        <pre id="summaryContent"></pre>
      </div>

      <div id="error" class="error hidden"></div>
    </main>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
